AutoName: DevPulse
Summary: Real-time system telemetry, hardware diagnostics, and monitoring utility.
Description: |-
  DevPulse is a modern, native Android system telemetry, hardware diagnostic suite, and real-time performance monitoring application built with Jetpack Compose and Material 3.

  Features:
  - Real-Time Dashboard with RAM, CPU per-core frequency streams, and hardware status.
  - Interactive Diagnostic Suite for display, touch, audio, sensors, camera, and charging.
  - Deep Telemetry for Android OS, Widevine DRM, memory/zRAM, thermal throttling, and network.
  - 100% Free & Open Source without tracking, ads, or proprietary SDKs.

