import groovy.json.JsonSlurper
import java.net.URLEncoder

def file = new File(gradle.startParameter.currentDir, "app/src/main/java/com/hamraj37/devpulse/util/AppLanguageManager.kt")
def content = file.text

def startIndex = content.indexOf("    private val translations = mapOf(")
def endIndex = content.indexOf("    fun translate(", startIndex)
if (startIndex == -1 || endIndex == -1) {
    println "Could not find translations block. startIndex=${startIndex}, endIndex=${endIndex}"
    return
}

def blockStartIndex = content.indexOf("(", startIndex) + 1
def blockEndIndex = content.lastIndexOf(")", endIndex)
def block = content.substring(blockStartIndex, blockEndIndex)

def langRegex = /"([a-z]{2})" to mapOf\((.*?)\)(?:,|$)/
def langMatcher = (block =~ /(?s)$langRegex/)

def hiKeys = []
def langMaps = [:]
def hiLines = []

def langs = ["hi", "es", "fr", "de", "pt", "ru", "ar", "ja", "zh"]
langs.each { langMaps[it] = [:] }

while (langMatcher.find()) {
    def lang = langMatcher.group(1)
    def langBlock = langMatcher.group(2)
    
    if (lang == "hi") {
        hiLines = langBlock.split('\n')
    }
    
    def pairs = [:]
    def pairMatcher = (langBlock =~ /(?s)"((?:\\.|[^"\\])*)" to "((?:\\.|[^"\\])*)"/)
    while (pairMatcher.find()) {
        def key = pairMatcher.group(1)
        def val = pairMatcher.group(2)
        pairs[key] = val
        if (lang == "hi") hiKeys << key
    }
    langMaps[lang] = pairs
}

def translateBatch = { texts, targetLang ->
    if (texts.isEmpty()) return []
    if (targetLang == "hi") return texts
    
    def apiLang = (targetLang == "zh") ? "zh-cn" : targetLang
    def joinedText = texts.join(" ||| ")
    def url = "https://api.popcat.xyz/translate?to=${apiLang}&text=${URLEncoder.encode(joinedText, 'UTF-8')}"
    
    int retries = 3
    while (retries > 0) {
        try {
            def connection = new URL(url).openConnection()
            connection.setRequestProperty("User-Agent", "Mozilla/5.0")
            connection.setConnectTimeout(10000)
            connection.setReadTimeout(10000)
            def response = connection.inputStream.text
            def json = new JsonSlurper().parseText(response)
            def translated = json.translated ?: ""
            
            def translatedParts = translated.split(" \\|\\|\\| |\\|\\|\\|| \\|\\| \\| |\\| \\| \\|")
            
            def result = []
            for (int i = 0; i < texts.size(); i++) {
                if (i < translatedParts.size()) {
                    result << translatedParts[i].trim().replace('"', '\\"')
                } else {
                    result << texts[i].replace('"', '\\"')
                }
            }
            return result
        } catch (Exception e) {
            retries--
            println "Error translating batch to ${targetLang}: ${e.message}"
            Thread.sleep(2000)
            if (retries == 0) return texts.collect { it.replace('"', '\\"') }
        }
    }
}

def logFile = new File(gradle.startParameter.currentDir, "update_log.txt")
logFile.text = ""

langs.each { lang ->
    if (lang != "hi") {
        def keysToTranslate = []
        hiKeys.each { key ->
            def currentVal = langMaps[lang][key]
            def hiVal = langMaps["hi"][key]
            // If missing, identical to Hindi, or identical to English key (from failed translate)
            if (currentVal == null || currentVal == hiVal || currentVal == key || (currentVal != null && currentVal.contains("not supported"))) {
                keysToTranslate << key
            }
        }
        
        if (!keysToTranslate.isEmpty()) {
            println "Translating ${keysToTranslate.size()} keys for ${lang}..."
            def chunkedKeys = keysToTranslate.collate(30)
            def translatedKeys = []
            chunkedKeys.each { chunk ->
                translatedKeys.addAll(translateBatch(chunk, lang))
                Thread.sleep(1000)
            }
            for (int i = 0; i < keysToTranslate.size(); i++) {
                def key = keysToTranslate[i]
                def translated = i < translatedKeys.size() ? translatedKeys[i] : key
                langMaps[lang][key] = translated
                logFile.append("Translated [${lang}] ${key} -> ${translated}\n")
            }
        }
    }
}

println "Translations finished."
logFile.append("Translations finished.\n")

def newBlock = ""
langs.eachWithIndex { lang, i ->
    newBlock += '\n        "' + lang + '" to mapOf('
    def entries = []
    hiLines.each { line ->
        def lineMatcher = (line =~ /^(.*?)"((?:\\.|[^"\\])*)" to "((?:\\.|[^"\\])*)"(.*?\r?)$/)
        if (lineMatcher.matches()) {
            def indent = lineMatcher.group(1)
            def key = lineMatcher.group(2)
            def val = langMaps[lang][key] ?: key
            def rest = lineMatcher.group(4)
            entries << "${indent}\"${key}\" to \"${val}\"${rest}"
        } else {
            entries << line
        }
    }
    
    if (entries.size() > 0 && entries[0].trim() == "") {
        entries.remove(0)
        newBlock += "\n"
    }
    while (entries.size() > 0 && entries.last().trim() == "") {
        entries.remove(entries.size() - 1)
    }
    newBlock += entries.join('\n')
    newBlock += '\n        )'
    if (i < langs.size() - 1) {
        newBlock += ','
    }
}
newBlock += '\n    '

def newContent = content.substring(0, blockStartIndex) + newBlock + content.substring(blockEndIndex)
file.text = newContent
new File(gradle.startParameter.currentDir, "newBlock.txt").text = newBlock
println "Updated successfully!"
logFile.append("Updated successfully!\n")
