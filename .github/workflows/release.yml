name: Android CI/CD Pipeline

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    name: Build & Test Android App
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code & Git LFS Assets
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew app:testDebugUnitTest --stacktrace

      - name: Build Signed Release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew app:assembleRelease --stacktrace

      - name: Build Debug APK
        run: ./gradlew app:assembleDebug --stacktrace

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: DevPulse-Release-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: ignore

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DevPulse-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore

      - name: Extract App Version Name
        id: get_version
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts || echo "1.0.0")
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT

      - name: Generate Professional Changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          COMMIT_RANGE="HEAD"
          if [ -n "$PREV_TAG" ]; then
            COMMIT_RANGE="${PREV_TAG}..HEAD"
          else
            COMMIT_RANGE="HEAD~15..HEAD"
          fi

          RAW_COMMITS=$(git log$COMMIT_RANGE --pretty=format:"%h|%s" --no-merges 2>/dev/null || git log -n 15 --pretty=format:"%h|%s" --no-merges)

          FEATS=""
          FIXES=""
          PERF=""
          OTHERS=""

          while IFS='|' read -r hash subject; do
            [ -z "$hash" ] && continue
            
            case "$subject" in
              feat*|Feat*)
                clean_msg=$(echo "$subject" | sed -E 's/^[Ff]eat(\([^)]+\))?:\s*//')
                FEATS+="- $clean_msg (\`$hash\`)"$'\n'
                ;;
              fix*|Fix*)
                clean_msg=$(echo "$subject" | sed -E 's/^[Ff]ix(\([^)]+\))?:\s*//')
                FIXES+="- $clean_msg (\`$hash\`)"$'\n'
                ;;
              perf*|Perf*)
                clean_msg=$(echo "$subject" | sed -E 's/^[Pp]erf(\([^)]+\))?:\s*//')
                PERF+="- $clean_msg (\`$hash\`)"$'\n'
                ;;
              *)
                OTHERS+="- $subject (\`$hash\`)"$'\n'
                ;;
            esac
          done <<< "$RAW_COMMITS"

          CHANGELOG=""
          if [ -n "$FEATS" ]; then
            CHANGELOG+="#### 🚀 Features & Enhancements"$'\n'"$FEATS"$'\n'
          fi
          if [ -n "$FIXES" ]; then
            CHANGELOG+="#### 🐛 Bug Fixes & Stability"$'\n'"$FIXES"$'\n'
          fi
          if [ -n "$PERF" ]; then
            CHANGELOG+="#### ⚡ Performance Improvements"$'\n'"$PERF"$'\n'
          fi
          if [ -n "$OTHERS" ]; then
            CHANGELOG+="#### 🛠️ Maintenance & Other Changes"$'\n'"$OTHERS"$'\n'
          fi

          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="*General bug fixes and performance improvements.*"$'\n'
          fi

          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Calculate Release File Checksums
        id: checksums
        run: |
          REL_SHA=$(sha256sum app/build/outputs/apk/release/app-release.apk | awk '{print $1}')
          DBG_SHA=$(sha256sum app/build/outputs/apk/debug/app-debug.apk | awk '{print $1}')
          echo "rel_sha=$REL_SHA" >> $GITHUB_OUTPUT
          echo "dbg_sha=$DBG_SHA" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v${{ steps.get_version.outputs.version_name }}
          name: DevPulse v${{ steps.get_version.outputs.version_name }}
          body: |
            ## DevPulse v${{ steps.get_version.outputs.version_name }}

            ### 📦 Build Overview
            | Property | Detail |
            | :--- | :--- |
            | **Version** | `${{ steps.get_version.outputs.version_name }}` |
            | **Target Platform** | Android 11+ (API 30–36) |
            | **Build Engine** | Gradle & OpenJDK 17 (Temurin) |
            | **Release Date** | ${{ github.event.repository.updated_at }} |

            ---

            ### 📋 What's Changed
            ${{ steps.changelog.outputs.changelog }}

            ---

            ### 🛡️ Checksums (SHA-256)
            ```text
            app-release.apk: ${{ steps.checksums.outputs.rel_sha }}
            app-debug.apk:   ${{ steps.checksums.outputs.dbg_sha }}
            ```

            ---

            > **Note:** For optimal telemetry access (per-core CPU frequencies and zRAM stats), ensure required runtime permissions are granted upon launch.
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
